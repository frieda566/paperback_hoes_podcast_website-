<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paperback Hoes Podcast</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/book.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js"
  }
}
</script>
<script type="module" src="js/books.js"></script>

</head>
<body>

<header>
    <div class="logo">
        <img src="images/logo.jpeg" alt="Paperback Hoes Logo">
        <span>Paperback Hoes</span>
    </div>

    <button class="button-29" id="themeBtn">
        Dark Mode
    </button>

    <nav id="mainNav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="Episodes.html">Episodes</a></li>
            <li><a href="Books.html">Books</a></li>
            <li><a href="Events.html">Events</a></li>
            <li><a href="Authors.html">Authors</a></li>
            <li><a href="Contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="header-right">
        <button class="menu-toggle" id="menuToggle" aria-label="open menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

</header> 

<section class="random-book">
    <div id="floatingBooks"></div>

    <div class="overlay-backdrop" id="overlayBackdrop">
        <div class="book-display" id="bookDisplay">
            <button class="button-29" id="closeOverlay">✕</button>
            <img id="selectedBook" src="" alt="Selected Book Cover">
            <div class="book-info-text">
                <h2 id="selectedTitle"></h2>
                <p id="selectedAuthor"></p>
                <div class="host-ratings">
                    <div class="host-rating">
                        <img src="images/Rachel.jpeg" alt="Rachel" class="host-avatar">
                        <div class="stars" id="rachelStars"></div>
                    </div>
                    <div class="host-rating">
                        <img src="images/laureen.jpeg" alt="Laureen" class="host-avatar">
                        <div class="stars" id="laureenStars"></div>
                    </div>
                </div>
                <iframe id="spotifyFrame" width="100%" height="152" frameborder="0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
                </iframe>
            </div>
        </div>
    </div>

    <button class="button-29" id="generateBtn">Generate Random Book</button>

    <div class="scroll-hint">
        <span>Scroll for more</span>
        <div class="scroll-arrow">↓</div>
    </div>
</section>

<section class="about">
  <div class="about-text">
    <h1>Books</h1>
    <p>
        Explore our curated list of book recommendations featured on the Paperback Hoes Podcast. 
        Discover new reads and find your next favorite book!
    </p>
  </div>
</section>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search books...">
  <button class="button-29" id="filterToggleBtn">Filter</button>
</div>

<div class="tag-filter" id="tagFilter"></div>

<div class="book-grid" id="BookGrid"></div>
<script type="module" src="js/books_filter.js"></script>
<script src="js/script.js"></script>

</body>
</html>
