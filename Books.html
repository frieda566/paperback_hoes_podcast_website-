<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paperback Hoes Podcast</title>
<link rel="stylesheet" href="css/style_assignment3.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js"
  }
}
</script>
<script type="module" src="js/books.js"></script>

</head>
<body>

<header>
    <div class="logo">
    <img src="images/cover.png" alt="Paperback Hoes Logo">
    <span>Paperback Hoes</span>
</div>

<button class="button-29">
    🌙 Reading Mode
</button>

    <nav>
        <ul>
            <li><a href="http://127.0.0.1:5500/assignment3.html">Home</a></li> 
            <li><a href="http://127.0.0.1:5500/Episodes.html">Episodes</a></li>
            <li><a href="http://127.0.0.1:5500/Books.html">Books</a></li>
            <li><a href="http://127.0.0.1:5500/Contact.html">Contact</a></li>
            <li><a href="http://127.0.0.1:5500/Events.html">Events</a></li>
            <li><a href="http://127.0.0.1:5500/Authors.html">Authors</a></li>
        </ul>
    </nav>
</header>

<section class="random-book">
<h1>Book Recommendation Generator</h1>
<p>Discover one of the books featured on Paperback Hoes.</p>
<button class="button-29" id="generateBtn">Generate Random Book</button>
<div id="floatingBooks"></div>
</section>

<div class="overlay-backdrop" id="overlayBackdrop">
  <div class="book-display" id="bookDisplay">
    <button class="button-29" id="closeOverlay">✕</button>
    <img id="selectedBook" src="" alt="Selected Book Cover">
    <div class="book-info-text">
      <h2 id="selectedTitle"></h2>
      <p id="selectedAuthor"></p>
      <iframe id="spotifyFrame" width="100%" height="152" frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>
    </div>
  </div>
</div>

</section>

<script src="js/books.js"></script>
</body>
</html>
